version: 2

updates:
  - package-ecosystem: nuget
    directory: /src/backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Fortaleza
    open-pull-requests-limit: 5
    groups:
      dotnet-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: build

  - package-ecosystem: npm
    directory: /src/frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: America/Fortaleza
    open-pull-requests-limit: 5
    groups:
      frontend-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: build

  - package-ecosystem: docker
    directory: /infrastructure/docker/backend
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: America/Fortaleza
    commit-message:
      prefix: build

  - package-ecosystem: docker
    directory: /infrastructure/docker/frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: America/Fortaleza
    commit-message:
      prefix: build

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Fortaleza
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
