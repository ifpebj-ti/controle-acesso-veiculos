name: Propor funcionalidade ou melhoria
description: Proponha uma mudança de produto ou engenharia vinculada a um problema real.
title: "[Melhoria]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Diferencie necessidade confirmada, hipótese do MVP e ideia futura. Não apresente suposição como aprovação institucional.
  - type: textarea
    id: contexto
    attributes:
      label: Contexto e problema
      description: Qual problema existe hoje, para qual ator e com qual evidência?
    validations:
      required: true
  - type: textarea
    id: objetivo
    attributes:
      label: Objetivo
      description: Qual resultado deve ser alcançado sem antecipar uma implementação específica?
    validations:
      required: true
  - type: dropdown
    id: maturidade
    attributes:
      label: Estado da necessidade
      options:
        - Confirmada no processo atual
        - Hipótese para homologação do MVP
        - Melhoria técnica interna
        - Evolução futura
    validations:
      required: true
  - type: textarea
    id: escopo
    attributes:
      label: Escopo proposto
      description: Liste as mudanças necessárias e as áreas envolvidas.
    validations:
      required: true
  - type: textarea
    id: aceite
    attributes:
      label: Critérios de aceite
      description: Use condições observáveis, testáveis e independentes da solução quando possível.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: dependencias
    attributes:
      label: Dependências e validações externas
      description: Informe contratos, outras Issues, decisões institucionais ou infraestrutura necessária.
    validations:
      required: true
  - type: textarea
    id: riscos
    attributes:
      label: Riscos técnicos, de segurança e privacidade
      description: Considere atores, dados, permissões, disponibilidade e fronteiras de confiança afetadas.
    validations:
      required: true
  - type: textarea
    id: fora-escopo
    attributes:
      label: Fora de escopo
      description: Liste explicitamente o que não será entregue nesta Issue.
    validations:
      required: true
  - type: checkboxes
    id: confirmacoes
    attributes:
      label: Confirmações
      options:
        - label: Pesquisei Issues abertas e fechadas e não encontrei uma duplicata.
          required: true
        - label: Não incluí credenciais, dados pessoais reais ou aprovações institucionais inventadas.
          required: true
