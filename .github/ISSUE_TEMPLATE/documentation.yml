name: Atualizar documentação
description: Registre correção, sincronização ou nova documentação do projeto.
title: "[Documentação]: "
labels:
  - documentation
body:
  - type: textarea
    id: contexto
    attributes:
      label: Contexto
      description: Qual documentação está ausente, incorreta ou desatualizada?
    validations:
      required: true
  - type: textarea
    id: fontes
    attributes:
      label: Fontes de verdade
      description: Indique código, Issue, PR, decisão ou evidência que sustenta a atualização.
    validations:
      required: true
  - type: textarea
    id: escopo
    attributes:
      label: Escopo
      description: Informe páginas e assuntos que devem mudar.
    validations:
      required: true
  - type: textarea
    id: aceite
    attributes:
      label: Critérios de aceite
      placeholder: |
        - [ ] O conteúdo corresponde ao comportamento atual.
        - [ ] Links e acentuação foram conferidos.
    validations:
      required: true
  - type: textarea
    id: dependencias
    attributes:
      label: Dependências, riscos e pendências
      description: Registre validações institucionais e diferenças entre implementação, hipótese e plano futuro.
    validations:
      required: true
  - type: textarea
    id: fora-escopo
    attributes:
      label: Fora de escopo
      description: Liste código, comportamento ou outros documentos que não serão alterados.
    validations:
      required: false
  - type: checkboxes
    id: confirmacoes
    attributes:
      label: Confirmações
      options:
        - label: Conferirei links, formatação e acentuação antes de concluir.
          required: true
        - label: Não incluí credenciais, dados pessoais reais ou resultados não comprovados.
          required: true
