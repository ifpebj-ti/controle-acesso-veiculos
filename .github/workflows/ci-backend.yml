name: CI - Backend

on:
  push:
    paths:
      - "src/backend/**"
      - "global.json"
      - ".editorconfig"
      - ".gitattributes"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    paths:
      - "src/backend/**"
      - "global.json"
      - ".editorconfig"
      - ".gitattributes"
      - ".github/workflows/ci-backend.yml"

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore src/backend/ControleAcessoVeiculos.slnx

      - name: Verify formatting and analyzers
        run: >-
          dotnet format src/backend/ControleAcessoVeiculos.slnx
          --verify-no-changes
          --no-restore

      - name: Build with warnings as errors
        run: >-
          dotnet build src/backend/ControleAcessoVeiculos.slnx
          --configuration Release
          --no-restore
          -warnaserror

      - name: Test with coverage
        run: >-
          dotnet test src/backend/ControleAcessoVeiculos.slnx
          --configuration Release
          --no-build
          --no-restore
          --coverage
          --coverage-output-format cobertura
          --report-trx
          --results-directory artifacts/test-results
          --verbosity normal

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-results-${{ github.run_number }}
          path: artifacts/test-results/**
          if-no-files-found: error
          retention-days: 14
