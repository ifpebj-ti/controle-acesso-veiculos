name: CI - Backend

on:
  push:
    paths:
      - "src/backend/**"
      - "infrastructure/ci/**"
      - "global.json"
      - ".editorconfig"
      - ".gitattributes"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    paths:
      - "src/backend/**"
      - "infrastructure/ci/**"
      - "global.json"
      - ".editorconfig"
      - ".gitattributes"
      - ".github/workflows/ci-backend.yml"

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore src/backend/ControleAcessoVeiculos.slnx

      - name: Verify formatting and analyzers
        run: >-
          dotnet format src/backend/ControleAcessoVeiculos.slnx
          --verify-no-changes
          --no-restore

      - name: Build with warnings as errors
        run: >-
          dotnet build src/backend/ControleAcessoVeiculos.slnx
          --configuration Release
          --no-restore
          -warnaserror

      - name: Test with coverage
        run: >-
          dotnet test src/backend/ControleAcessoVeiculos.slnx
          --configuration Release
          --no-build
          --no-restore
          --coverage
          --coverage-output-format cobertura
          --report-trx
          --results-directory artifacts/test-results
          --verbosity normal

      - name: Verify coverage consolidation regression cases
        run: python3 -m unittest discover -s infrastructure/ci/tests -p 'test_backend_coverage.py'

      - name: Enforce measured backend line coverage
        run: >-
          python3 infrastructure/ci/summarize_backend_coverage.py artifacts/test-results
          --minimum-lines 70 --output artifacts/backend-coverage-summary

      - name: Publish coverage summary
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/backend-coverage-summary/summary.md ]; then
            cat artifacts/backend-coverage-summary/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Generate coverage badges
        run: python3 infrastructure/ci/generate_coverage_badges.py artifacts/test-results artifacts/coverage-badges

      - name: Upload coverage badge SVGs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-badge-svgs
          path: artifacts/coverage-badges/*.svg
          if-no-files-found: error
          retention-days: 1

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-results-${{ github.run_number }}
          path: |
            artifacts/test-results/**
            artifacts/backend-coverage-summary/**
          if-no-files-found: error
          retention-days: 14

  publish-coverage-badges:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download badge SVGs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-badge-svgs
          path: ${{ runner.temp }}/coverage-badge-svgs

      - name: Publish badges on the dedicated branch
        shell: bash
        env:
          BADGE_DIR: ${{ runner.temp }}/coverage-badge-svgs
        run: |
          set -euo pipefail
          badge_branch=coverage-badges
          if git ls-remote --exit-code --heads origin "refs/heads/${badge_branch}" >/dev/null; then
            git fetch --no-tags origin "refs/heads/${badge_branch}"
            git switch --detach FETCH_HEAD
          else
            status=$?
            if [[ "$status" != 2 ]]; then
              exit "$status"
            fi
            git switch --orphan "${badge_branch}"
          fi
          cp "${BADGE_DIR}/coverage-lines.svg" "${BADGE_DIR}/coverage-branches.svg" .
          git add -- coverage-lines.svg coverage-branches.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -m "ci: refresh backend coverage badges" -m "Source: ${GITHUB_SHA}"
          git push origin "HEAD:refs/heads/${badge_branch}"
