name: CI - Containers

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
    paths:
      - ".dockerignore"
      - "infrastructure/docker/**"
      - "infrastructure/security/**"
      - "src/backend/**"
      - "src/frontend/**"
      - ".github/workflows/ci-containers.yml"
  pull_request:
    paths:
      - ".dockerignore"
      - "infrastructure/docker/**"
      - "infrastructure/security/**"
      - "src/backend/**"
      - "src/frontend/**"
      - ".github/workflows/ci-containers.yml"

permissions:
  contents: read

concurrency:
  group: containers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-scan:
    name: Build and scan ${{ matrix.image }} (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            dockerfile: infrastructure/docker/backend/Dockerfile
            platform: linux/amd64
            architecture: amd64
          - image: backend
            dockerfile: infrastructure/docker/backend/Dockerfile
            platform: linux/arm64
            architecture: arm64
          - image: frontend
            dockerfile: infrastructure/docker/frontend/Dockerfile
            platform: linux/amd64
            architecture: amd64
          - image: frontend
            dockerfile: infrastructure/docker/frontend/Dockerfile
            platform: linux/arm64
            architecture: arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        if: matrix.architecture == 'arm64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: controle-acesso-veiculos/${{ matrix.image }}:${{ github.sha }}-${{ matrix.architecture }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.architecture }}

      - name: Reject all critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: controle-acesso-veiculos/${{ matrix.image }}:${{ github.sha }}-${{ matrix.architecture }}
          format: table
          exit-code: "1"
          ignore-unfixed: false
          vuln-type: os,library
          severity: CRITICAL

      - name: Report all high vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: controle-acesso-veiculos/${{ matrix.image }}:${{ github.sha }}-${{ matrix.architecture }}
          format: table
          exit-code: "0"
          ignore-unfixed: false
          vuln-type: os,library
          severity: HIGH

      - name: Reject fixable high vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: controle-acesso-veiculos/${{ matrix.image }}:${{ github.sha }}-${{ matrix.architecture }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH

      - name: Generate image SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: controle-acesso-veiculos/${{ matrix.image }}:${{ github.sha }}-${{ matrix.architecture }}
          format: spdx-json
          output: ${{ github.workspace }}/${{ matrix.image }}-${{ matrix.architecture }}.spdx.json
          exit-code: "0"
          vuln-type: os,library

      - name: Validate image SBOM
        shell: bash
        run: |
          sbom_path="${GITHUB_WORKSPACE}/${{ matrix.image }}-${{ matrix.architecture }}.spdx.json"

          if [[ ! -s "${sbom_path}" ]]; then
            echo "SBOM was not generated: ${sbom_path}" >&2
            exit 1
          fi

          sbom_size="$(stat --format='%s' "${sbom_path}")"
          if (( sbom_size > 16777216 )); then
            echo "SBOM exceeds the 16 MiB attestation limit: ${sbom_size} bytes" >&2
            exit 1
          fi

          jq --exit-status '
            .spdxVersion == "SPDX-2.3"
            and ((.packages | type) == "array")
            and ((.packages | length) > 0)
          ' "${sbom_path}" > /dev/null

  compose-smoke-test:
    name: Run integrated Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: cav-smoke-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_DB: cav_smoke
      POSTGRES_USER: cav_smoke
      POSTGRES_PORT: "0"
      API_PORT: "0"
      FRONTEND_PORT: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate ephemeral credentials
        shell: bash
        run: |
          postgres_password="$(openssl rand -hex 24)"
          jwt_signing_key="$(openssl rand -base64 48 | tr -d '\n')"
          echo "::add-mask::${postgres_password}"
          echo "::add-mask::${jwt_signing_key}"
          echo "POSTGRES_PASSWORD=${postgres_password}" >> "${GITHUB_ENV}"
          echo "JWT_SIGNING_KEY=${jwt_signing_key}" >> "${GITHUB_ENV}"

      - name: Validate Compose configuration
        working-directory: infrastructure/docker
        run: docker compose config --quiet

      - name: Start integrated stack
        working-directory: infrastructure/docker
        run: docker compose up --build --detach

      - name: Verify API readiness
        working-directory: infrastructure/docker
        shell: bash
        run: |
          api_port="$(docker compose port backend 8080 | sed 's/.*://')"
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 30 \
            --retry-all-errors \
            --retry-delay 2 \
            "http://127.0.0.1:${api_port}/health/ready" \
            | jq --exit-status '.status == "Healthy"'

      - name: Verify frontend response
        working-directory: infrastructure/docker
        shell: bash
        run: |
          frontend_port="$(docker compose port frontend 8080 | sed 's/.*://')"
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 30 \
            --retry-all-errors \
            --retry-delay 2 \
            "http://127.0.0.1:${frontend_port}/" \
            | grep --fixed-strings --quiet '<div id="root"></div>'

      - name: Verify frontend API reverse proxy
        working-directory: infrastructure/docker
        shell: bash
        run: |
          frontend_port="$(docker compose port frontend 8080 | sed 's/.*://')"
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 30 \
            --retry-all-errors \
            --retry-delay 2 \
            "http://127.0.0.1:${frontend_port}/api/health/ready" \
            | jq --exit-status '.status == "Healthy"'

      - name: Verify frontend security headers
        working-directory: infrastructure/docker
        shell: bash
        run: |
          frontend_port="$(docker compose port frontend 8080 | sed 's/.*://')"
          frontend_headers="$(curl \
            --head \
            --silent \
            --show-error \
            --retry 30 \
            --retry-all-errors \
            --retry-delay 2 \
            "http://127.0.0.1:${frontend_port}/" \
            | tr -d '\r')"
          proxy_error_headers="$(curl \
            --head \
            --silent \
            --show-error \
            "http://127.0.0.1:${frontend_port}/api/route-that-does-not-exist" \
            | tr -d '\r')"

          verify_headers() {
            local headers="$1"

            grep --fixed-strings --ignore-case --quiet \
              "content-security-policy: default-src 'none'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; manifest-src 'self'; object-src 'none'; script-src 'self'; style-src 'self'" \
              <<< "${headers}"
            grep --fixed-strings --ignore-case --quiet \
              'cross-origin-opener-policy: same-origin' <<< "${headers}"
            grep --fixed-strings --ignore-case --quiet \
              'cross-origin-resource-policy: same-origin' <<< "${headers}"
            grep --fixed-strings --ignore-case --quiet \
              'permissions-policy: camera=(), geolocation=(), microphone=(), payment=(), usb=()' \
              <<< "${headers}"
            grep --fixed-strings --ignore-case --quiet \
              'referrer-policy: no-referrer' <<< "${headers}"
            grep --fixed-strings --ignore-case --quiet \
              'x-content-type-options: nosniff' <<< "${headers}"
            grep --fixed-strings --ignore-case --quiet \
              'x-frame-options: DENY' <<< "${headers}"

            if grep --extended-regexp --ignore-case --quiet \
              '^server: nginx/[0-9]' <<< "${headers}"; then
              echo 'The Nginx version must not be disclosed.' >&2
              return 1
            fi
          }

          verify_headers "${frontend_headers}"
          verify_headers "${proxy_error_headers}"

      - name: Run passive OWASP ZAP baseline
        shell: bash
        run: |
          report_directory="${GITHUB_WORKSPACE}/artifacts/zap"
          install --directory --mode 0777 "${report_directory}"
          cp infrastructure/security/zap-baseline.conf \
            "${report_directory}/zap-baseline.conf"

          set +e
          docker run --rm \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --network "${COMPOSE_PROJECT_NAME}_app-network" \
            --volume "${report_directory}:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:2.17.0@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef \
            zap-baseline.py \
            -t http://frontend:8080 \
            -m 1 \
            -c zap-baseline.conf \
            -J zap-report.json \
            -r zap-report.html \
            -w zap-report.md
          zap_exit_code=$?
          set -e

          for report in zap-report.json zap-report.html zap-report.md; do
            if [[ ! -s "${report_directory}/${report}" ]]; then
              echo "ZAP report was not generated: ${report}" >&2
              exit 1
            fi
          done

          case "${zap_exit_code}" in
            0)
              echo "OWASP ZAP baseline completed without alerts." \
                >> "${GITHUB_STEP_SUMMARY}"
              ;;
            2)
              echo "OWASP ZAP baseline completed with reviewed warnings. See the attached report." \
                >> "${GITHUB_STEP_SUMMARY}"
              ;;
            1)
              echo "OWASP ZAP found an alert classified as FAIL." >&2
              exit 1
              ;;
            *)
              echo "OWASP ZAP failed to complete (exit code ${zap_exit_code})." >&2
              exit "${zap_exit_code}"
              ;;
          esac

      - name: Upload OWASP ZAP reports
        if: ${{ always() && hashFiles('artifacts/zap/zap-report.*') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zap-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/zap/zap-report.*
          if-no-files-found: error
          retention-days: 14

      - name: Show Compose diagnostics
        if: failure()
        working-directory: infrastructure/docker
        run: |
          docker compose ps --all
          docker compose logs --no-color --timestamps

      - name: Remove disposable stack
        if: always()
        working-directory: infrastructure/docker
        run: docker compose down --volumes --remove-orphans --timeout 10

  publish-platform:
    name: Publish verified ${{ matrix.image }} (${{ matrix.platform }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - build-and-scan
      - compose-smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            dockerfile: infrastructure/docker/backend/Dockerfile
            platform: linux/amd64
            architecture: amd64
          - image: backend
            dockerfile: infrastructure/docker/backend/Dockerfile
            platform: linux/arm64
            architecture: arm64
          - image: frontend
            dockerfile: infrastructure/docker/frontend/Dockerfile
            platform: linux/amd64
            architecture: amd64
          - image: frontend
            dockerfile: infrastructure/docker/frontend/Dockerfile
            platform: linux/arm64
            architecture: arm64
    env:
      IMAGE_NAME: ghcr.io/ifpebj-ti/controle-acesso-veiculos-${{ matrix.image }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        if: matrix.architecture == 'arm64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image for publication
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-${{ matrix.architecture }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.architecture }}

      - name: Reject all critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-${{ matrix.architecture }}
          format: table
          exit-code: "1"
          ignore-unfixed: false
          vuln-type: os,library
          severity: CRITICAL

      - name: Report all high vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-${{ matrix.architecture }}
          format: table
          exit-code: "0"
          ignore-unfixed: false
          vuln-type: os,library
          severity: HIGH

      - name: Reject fixable high vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-${{ matrix.architecture }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH

      - name: Generate image SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-${{ matrix.architecture }}
          format: spdx-json
          output: ${{ github.workspace }}/${{ matrix.image }}-${{ matrix.architecture }}.spdx.json
          exit-code: "0"
          vuln-type: os,library

      - name: Validate image SBOM
        shell: bash
        run: |
          sbom_path="${GITHUB_WORKSPACE}/${{ matrix.image }}-${{ matrix.architecture }}.spdx.json"

          if [[ ! -s "${sbom_path}" ]]; then
            echo "SBOM was not generated: ${sbom_path}" >&2
            exit 1
          fi

          sbom_size="$(stat --format='%s' "${sbom_path}")"
          if (( sbom_size > 16777216 )); then
            echo "SBOM exceeds the 16 MiB attestation limit: ${sbom_size} bytes" >&2
            exit 1
          fi

          jq --exit-status '
            .spdxVersion == "SPDX-2.3"
            and ((.packages | type) == "array")
            and ((.packages | length) > 0)
          ' "${sbom_path}" > /dev/null

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: true

      - name: Push verified platform image
        id: push
        shell: bash
        run: |
          platform_tag="${IMAGE_NAME}:sha-${GITHUB_SHA}-${{ matrix.architecture }}"
          docker push "${platform_tag}"

          digest="$(
            docker buildx imagetools inspect \
              "${platform_tag}" \
              --format '{{json .Manifest.Digest}}' \
              | tr -d '"'
          )"

          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Could not resolve a valid digest for ${platform_tag}" >&2
            exit 1
          fi

          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Upload platform SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.image }}-${{ matrix.architecture }}
          path: ${{ github.workspace }}/${{ matrix.image }}-${{ matrix.architecture }}.spdx.json
          if-no-files-found: error
          retention-days: 14

  publish-manifest:
    name: Publish verified ${{ matrix.image }} multi-platform manifest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - publish-platform
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - backend
          - frontend
    env:
      IMAGE_NAME: ghcr.io/ifpebj-ti/controle-acesso-veiculos-${{ matrix.image }}

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: true

      - name: Download platform SBOMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sbom-${{ matrix.image }}-*
          path: ${{ github.workspace }}/sboms
          merge-multiple: true

      - name: Create and validate multi-platform manifest
        id: manifest
        shell: bash
        run: |
          immutable_tag="${IMAGE_NAME}:sha-${GITHUB_SHA}"

          docker buildx imagetools create \
            --tag "${immutable_tag}" \
            --tag "${IMAGE_NAME}:main" \
            "${IMAGE_NAME}:sha-${GITHUB_SHA}-amd64" \
            "${IMAGE_NAME}:sha-${GITHUB_SHA}-arm64"

          manifest_json="$(docker buildx imagetools inspect "${immutable_tag}" --raw)"

          jq --exit-status '
            (.schemaVersion == 2)
            and ([
              .manifests[]
              | select(.platform.os == "linux")
              | .platform.architecture
            ] | sort == ["amd64", "arm64"])
            and ([.manifests[] | select(.platform.os == "linux")] | length == 2)
          ' <<< "${manifest_json}" > /dev/null

          digest="$(
            docker buildx imagetools inspect \
              "${immutable_tag}" \
              --format '{{json .Manifest.Digest}}' \
              | tr -d '"'
          )"

          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Could not resolve a valid digest for ${immutable_tag}" >&2
            exit 1
          fi

          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Attest published manifest provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      - name: Attest amd64 SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          sbom-path: ${{ github.workspace }}/sboms/${{ matrix.image }}-amd64.spdx.json
          push-to-registry: true

      - name: Attest arm64 SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          sbom-path: ${{ github.workspace }}/sboms/${{ matrix.image }}-arm64.spdx.json
          push-to-registry: true

  publish-release-tag:
    name: Publish verified ${{ matrix.image }} release tag
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-and-scan
      - compose-smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - backend
          - frontend
    env:
      IMAGE_NAME: ghcr.io/ifpebj-ti/controle-acesso-veiculos-${{ matrix.image }}

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: true

      - name: Validate and publish semantic version tag
        shell: bash
        run: |
          release_version="${GITHUB_REF_NAME#v}"

          if [[ ! "${release_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          immutable_tag="${IMAGE_NAME}:sha-${GITHUB_SHA}"
          release_tag="${IMAGE_NAME}:${release_version}"
          manifest_json="$(docker buildx imagetools inspect "${immutable_tag}" --raw)"

          jq --exit-status '
            (.schemaVersion == 2)
            and ([
              .manifests[]
              | select(.platform.os == "linux")
              | .platform.architecture
            ] | sort == ["amd64", "arm64"])
            and ([.manifests[] | select(.platform.os == "linux")] | length == 2)
          ' <<< "${manifest_json}" > /dev/null

          source_digest="$(
            docker buildx imagetools inspect \
              "${immutable_tag}" \
              --format '{{json .Manifest.Digest}}' \
              | tr -d '"'
          )"

          if [[ ! "${source_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Could not resolve a valid digest for ${immutable_tag}" >&2
            exit 1
          fi

          docker buildx imagetools create \
            --tag "${release_tag}" \
            "${IMAGE_NAME}@${source_digest}"

          release_digest="$(
            docker buildx imagetools inspect \
              "${release_tag}" \
              --format '{{json .Manifest.Digest}}' \
              | tr -d '"'
          )"

          if [[ "${release_digest}" != "${source_digest}" ]]; then
            echo "Release tag digest does not match ${immutable_tag}" >&2
            exit 1
          fi
