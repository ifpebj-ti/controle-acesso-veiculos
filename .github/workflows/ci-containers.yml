name: CI - Containers

on:
  push:
    paths:
      - ".dockerignore"
      - "infrastructure/docker/**"
      - "src/backend/**"
      - "src/frontend/**"
      - ".github/workflows/ci-containers.yml"
  pull_request:
    paths:
      - ".dockerignore"
      - "infrastructure/docker/**"
      - "src/backend/**"
      - "src/frontend/**"
      - ".github/workflows/ci-containers.yml"

permissions:
  contents: read

concurrency:
  group: containers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-scan:
    name: Build and scan ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            dockerfile: infrastructure/docker/backend/Dockerfile
          - image: frontend
            dockerfile: infrastructure/docker/frontend/Dockerfile

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: controle-acesso-veiculos/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Scan image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: controle-acesso-veiculos/${{ matrix.image }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

  compose-smoke-test:
    name: Run integrated Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: cav-smoke-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_DB: cav_smoke
      POSTGRES_USER: cav_smoke
      POSTGRES_PORT: "0"
      API_PORT: "0"
      FRONTEND_PORT: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate ephemeral credentials
        shell: bash
        run: |
          postgres_password="$(openssl rand -hex 24)"
          jwt_signing_key="$(openssl rand -base64 48 | tr -d '\n')"
          echo "::add-mask::${postgres_password}"
          echo "::add-mask::${jwt_signing_key}"
          echo "POSTGRES_PASSWORD=${postgres_password}" >> "${GITHUB_ENV}"
          echo "JWT_SIGNING_KEY=${jwt_signing_key}" >> "${GITHUB_ENV}"

      - name: Validate Compose configuration
        working-directory: infrastructure/docker
        run: docker compose config --quiet

      - name: Start integrated stack
        working-directory: infrastructure/docker
        run: docker compose up --build --detach

      - name: Verify API readiness
        working-directory: infrastructure/docker
        shell: bash
        run: |
          api_port="$(docker compose port backend 8080 | sed 's/.*://')"
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 30 \
            --retry-all-errors \
            --retry-delay 2 \
            "http://127.0.0.1:${api_port}/health/ready" \
            | jq --exit-status '.status == "Healthy"'

      - name: Verify frontend response
        working-directory: infrastructure/docker
        shell: bash
        run: |
          frontend_port="$(docker compose port frontend 8080 | sed 's/.*://')"
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 30 \
            --retry-all-errors \
            --retry-delay 2 \
            "http://127.0.0.1:${frontend_port}/" \
            | grep --fixed-strings --quiet '<div id="root"></div>'

      - name: Show Compose diagnostics
        if: failure()
        working-directory: infrastructure/docker
        run: |
          docker compose ps --all
          docker compose logs --no-color --timestamps

      - name: Remove disposable stack
        if: always()
        working-directory: infrastructure/docker
        run: docker compose down --volumes --remove-orphans --timeout 10

  publish:
    name: Publish verified ${{ matrix.image }} image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - build-and-scan
      - compose-smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            dockerfile: infrastructure/docker/backend/Dockerfile
          - image: frontend
            dockerfile: infrastructure/docker/frontend/Dockerfile
    env:
      IMAGE_NAME: ghcr.io/ifpebj-ti/controle-acesso-veiculos-${{ matrix.image }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image for publication
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:main
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Scan publication image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: true

      - name: Push verified image tags
        id: push
        shell: bash
        run: |
          docker push "${IMAGE_NAME}:sha-${GITHUB_SHA}"
          docker push "${IMAGE_NAME}:main"

          digest="$(
            docker buildx imagetools inspect \
              "${IMAGE_NAME}:sha-${GITHUB_SHA}" \
              --format '{{json .Manifest.Digest}}' \
              | tr -d '"'
          )"

          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Could not resolve a valid digest for ${IMAGE_NAME}:sha-${GITHUB_SHA}" >&2
            exit 1
          fi

          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Attest published image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
