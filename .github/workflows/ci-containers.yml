name: CI - Containers

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
    paths:
      - ".dockerignore"
      - "infrastructure/docker/**"
      - "infrastructure/security/**"
      - "src/backend/**"
      - "src/frontend/**"
      - ".github/workflows/ci-containers.yml"
  pull_request:
    paths:
      - ".dockerignore"
      - "infrastructure/docker/**"
      - "infrastructure/security/**"
      - "src/backend/**"
      - "src/frontend/**"
      - ".github/workflows/ci-containers.yml"

permissions:
  contents: read

concurrency:
  group: containers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-scan:
    name: Build and scan ${{ matrix.image }} (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            dockerfile: infrastructure/docker/backend/Dockerfile
            platform: linux/amd64
            architecture: amd64
          - image: backend
            dockerfile: infrastructure/docker/backend/Dockerfile
            platform: linux/arm64
            architecture: arm64
          - image: frontend
            dockerfile: infrastructure/docker/frontend/Dockerfile
            platform: linux/amd64
            architecture: amd64
          - image: frontend
            dockerfile: infrastructure/docker/frontend/Dockerfile
            platform: linux/arm64
            architecture: arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        if: matrix.architecture == 'arm64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          pull: true
          tags: controle-acesso-veiculos/${{ matrix.image }}:${{ github.sha }}-${{ matrix.architecture }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.architecture }}

      - name: Reject all critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: controle-acesso-veiculos/${{ matrix.image }}:${{ github.sha }}-${{ matrix.architecture }}
          format: table
          exit-code: "1"
          ignore-unfixed: false
          vuln-type: os,library
          severity: CRITICAL

      - name: Report all high vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: controle-acesso-veiculos/${{ matrix.image }}:${{ github.sha }}-${{ matrix.architecture }}
          format: table
          exit-code: "0"
          ignore-unfixed: false
          vuln-type: os,library
          severity: HIGH

      - name: Reject fixable high vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: controle-acesso-veiculos/${{ matrix.image }}:${{ github.sha }}-${{ matrix.architecture }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH

      - name: Generate image SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: controle-acesso-veiculos/${{ matrix.image }}:${{ github.sha }}-${{ matrix.architecture }}
          format: spdx-json
          output: ${{ github.workspace }}/${{ matrix.image }}-${{ matrix.architecture }}.spdx.json
          exit-code: "0"
          vuln-type: os,library

      - name: Validate image SBOM
        shell: bash
        run: |
          sbom_path="${GITHUB_WORKSPACE}/${{ matrix.image }}-${{ matrix.architecture }}.spdx.json"

          if [[ ! -s "${sbom_path}" ]]; then
            echo "SBOM was not generated: ${sbom_path}" >&2
            exit 1
          fi

          sbom_size="$(stat --format='%s' "${sbom_path}")"
          if (( sbom_size > 16777216 )); then
            echo "SBOM exceeds the 16 MiB attestation limit: ${sbom_size} bytes" >&2
            exit 1
          fi

          jq --exit-status '
            .spdxVersion == "SPDX-2.3"
            and ((.packages | type) == "array")
            and ((.packages | length) > 0)
          ' "${sbom_path}" > /dev/null

  compose-smoke-test:
    name: Run integrated Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: cav-smoke-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_DB: cav_smoke
      POSTGRES_USER: cav_smoke
      POSTGRES_PORT: "0"
      API_PORT: "0"
      FRONTEND_PORT: "0"
      DEPLOYMENT_VERSION: 0.4.0
      ALLOWED_HOSTS: acesso-veiculos.example.test;localhost

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate ephemeral credentials
        shell: bash
        run: |
          postgres_password="$(openssl rand -hex 24)"
          jwt_signing_key="$(openssl rand -base64 48 | tr -d '\n')"
          data_protection_password="$(openssl rand -base64 48 | tr -d '\n')"
          echo "::add-mask::${postgres_password}"
          echo "::add-mask::${jwt_signing_key}"
          echo "::add-mask::${data_protection_password}"
          mkdir -p infrastructure/docker/secrets
          openssl req -x509 -newkey rsa:3072 -sha256 -nodes \
            -subj '/CN=controle-acesso-veiculos-ci' \
            -keyout "${RUNNER_TEMP}/data-protection.key" \
            -out "${RUNNER_TEMP}/data-protection.crt" \
            -days 1
          openssl pkcs12 -export \
            -inkey "${RUNNER_TEMP}/data-protection.key" \
            -in "${RUNNER_TEMP}/data-protection.crt" \
            -out infrastructure/docker/secrets/data-protection.pfx \
            -passout "pass:${data_protection_password}"
          printf '%s' "${data_protection_password}" \
            > infrastructure/docker/secrets/data-protection-password.txt
          printf '%s' "${postgres_password}" \
            > infrastructure/docker/secrets/postgresql-password.txt
          printf '%s' \
            "Host=postgresql;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${postgres_password};GSS Encryption Mode=Disable" \
            > infrastructure/docker/secrets/database-connection.txt
          printf '%s' "${jwt_signing_key}" \
            > infrastructure/docker/secrets/jwt-signing-key.txt
          chmod 0444 \
            infrastructure/docker/secrets/data-protection.pfx \
            infrastructure/docker/secrets/data-protection-password.txt \
            infrastructure/docker/secrets/postgresql-password.txt \
            infrastructure/docker/secrets/database-connection.txt \
            infrastructure/docker/secrets/jwt-signing-key.txt
          echo "POSTGRES_PASSWORD=${postgres_password}" >> "${GITHUB_ENV}"
          echo "JWT_SIGNING_KEY=${jwt_signing_key}" >> "${GITHUB_ENV}"
          echo "POSTGRES_PASSWORD_FILE=./secrets/postgresql-password.txt" >> "${GITHUB_ENV}"
          echo "DATABASE_CONNECTION_FILE=./secrets/database-connection.txt" >> "${GITHUB_ENV}"
          echo "JWT_SIGNING_KEY_FILE=./secrets/jwt-signing-key.txt" >> "${GITHUB_ENV}"
          echo "DATA_PROTECTION_CERTIFICATE_FILE=./secrets/data-protection.pfx" >> "${GITHUB_ENV}"
          echo "DATA_PROTECTION_CERTIFICATE_PASSWORD_FILE=./secrets/data-protection-password.txt" >> "${GITHUB_ENV}"
          echo "DATA_PROTECTION_KEY_RING_VOLUME=cav-smoke-data-protection-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "${GITHUB_ENV}"

      - name: Create external production key-ring volume
        run: >-
          docker volume create
          "cav-smoke-data-protection-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Validate Compose configuration
        working-directory: infrastructure/docker
        run: docker compose config --quiet

      - name: Validate production Compose configuration
        working-directory: infrastructure/docker
        shell: bash
        run: |
          rendered_compose="$(docker compose --file docker-compose.production.yml config)"

          if grep --extended-regexp --quiet '^[[:space:]]+build:' <<< "${rendered_compose}"; then
            echo "Production Compose must consume published images without build directives." >&2
            exit 1
          fi

          jq --exit-status --arg version "${DEPLOYMENT_VERSION}" '
            .services.backend.image == (
              "ghcr.io/ifpebj-ti/controle-acesso-veiculos-backend:" + $version
            )
            and .services.frontend.image == (
              "ghcr.io/ifpebj-ti/controle-acesso-veiculos-frontend:" + $version
            )
            and (.services.backend.ports == null)
            and (.services.postgresql.ports == null)
            and (.services.backend.environment.ASPNETCORE_FORWARDEDHEADERS_ENABLED == "true")
            and (.services.backend.environment.Authentication__Jwt__SigningKey == null)
            and (.services.backend.environment.ConnectionStrings__DefaultConnection == null)
            and (.services.backend.environment.Authentication__Jwt__SigningKeyFile == "/run/secrets/jwt-signing-key")
            and (.services.backend.environment.ConnectionStrings__DefaultConnectionFile == "/run/secrets/database-connection")
            and (.services.postgresql.environment.POSTGRES_PASSWORD == null)
            and (.services.postgresql.environment.POSTGRES_PASSWORD_FILE == "/run/secrets/postgresql-password")
          ' <<< "$(docker compose --file docker-compose.production.yml config --format json)" \
            > /dev/null

      - name: Start integrated stack
        working-directory: infrastructure/docker
        run: docker compose up --build --detach

      - name: Verify API readiness
        working-directory: infrastructure/docker
        shell: bash
        run: |
          api_port="$(docker compose port backend 8080 | sed 's/.*://')"
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 30 \
            --retry-all-errors \
            --retry-delay 2 \
            "http://127.0.0.1:${api_port}/health/ready" \
            | jq --exit-status '.status == "Healthy"'

      - name: Verify frontend response
        working-directory: infrastructure/docker
        shell: bash
        run: |
          frontend_port="$(docker compose port frontend 8080 | sed 's/.*://')"
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 30 \
            --retry-all-errors \
            --retry-delay 2 \
            "http://127.0.0.1:${frontend_port}/" \
            | grep --fixed-strings --quiet '<div id="root"></div>'

      - name: Verify frontend API reverse proxy
        working-directory: infrastructure/docker
        shell: bash
        run: |
          frontend_port="$(docker compose port frontend 8080 | sed 's/.*://')"
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 30 \
            --retry-all-errors \
            --retry-delay 2 \
            "http://127.0.0.1:${frontend_port}/api/health/ready" \
            | jq --exit-status '.status == "Healthy"'

      - name: Verify Google OIDC callback reverse proxy
        working-directory: infrastructure/docker
        shell: bash
        run: |
          api_port="$(docker compose port backend 8080 | sed 's/.*://')"
          frontend_port="$(docker compose port frontend 8080 | sed 's/.*://')"
          backend_body="${RUNNER_TEMP}/google-callback-backend.txt"
          frontend_body="${RUNNER_TEMP}/google-callback-frontend.txt"

          backend_status="$(curl \
            --silent \
            --show-error \
            --output "${backend_body}" \
            --write-out '%{http_code}' \
            "http://127.0.0.1:${api_port}/signin-google")"
          frontend_status="$(curl \
            --silent \
            --show-error \
            --output "${frontend_body}" \
            --write-out '%{http_code}' \
            "http://127.0.0.1:${frontend_port}/signin-google")"

          if [[ "${frontend_status}" != "${backend_status}" ]]; then
            echo "The public callback did not preserve the backend status." >&2
            exit 1
          fi

          if grep --fixed-strings --quiet '<div id="root"></div>' "${frontend_body}"; then
            echo "The Google callback was incorrectly handled by the SPA." >&2
            exit 1
          fi

      - name: Verify Data Protection survives backend replacement
        working-directory: infrastructure/docker
        shell: bash
        run: |
          api_port="$(docker compose port backend 8080 | sed 's/.*://')"
          cookie_jar="${RUNNER_TEMP}/data-protection-cookies.txt"
          csrf_response="$(curl \
            --fail \
            --silent \
            --show-error \
            --retry 10 \
            --retry-all-errors \
            --retry-delay 1 \
            --cookie-jar "${cookie_jar}" \
            "http://127.0.0.1:${api_port}/auth/csrf")"
          csrf_token="$(jq --raw-output '.requestToken' <<< "${csrf_response}")"

          docker compose up --detach --wait --force-recreate backend
          api_port="$(docker compose port backend 8080 | sed 's/.*://')"

          status="$(curl \
            --silent \
            --show-error \
            --retry 10 \
            --retry-all-errors \
            --retry-delay 1 \
            --output /dev/null \
            --write-out '%{http_code}' \
            --cookie "${cookie_jar}" \
            --header "X-CSRF-TOKEN: ${csrf_token}" \
            --request POST \
            "http://127.0.0.1:${api_port}/auth/refresh")"

          if [[ "${status}" != "401" ]]; then
            echo "Expected a valid antiforgery token followed by an unauthenticated refresh (401), received ${status}." >&2
            exit 1
          fi

          docker compose exec -T backend sh -ec \
            'grep -R --quiet EncryptedData /var/lib/controle-acesso-veiculos/data-protection/key-*.xml'

      - name: Verify frontend security headers
        working-directory: infrastructure/docker
        shell: bash
        run: |
          frontend_port="$(docker compose port frontend 8080 | sed 's/.*://')"
          frontend_headers="$(curl \
            --head \
            --silent \
            --show-error \
            --retry 30 \
            --retry-all-errors \
            --retry-delay 2 \
            "http://127.0.0.1:${frontend_port}/" \
            | tr -d '\r')"
          proxy_error_headers="$(curl \
            --head \
            --silent \
            --show-error \
            "http://127.0.0.1:${frontend_port}/api/route-that-does-not-exist" \
            | tr -d '\r')"

          verify_headers() {
            local headers="$1"

            grep --fixed-strings --ignore-case --quiet \
              "content-security-policy: default-src 'none'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; manifest-src 'self'; object-src 'none'; script-src 'self'; style-src 'self'" \
              <<< "${headers}"
            grep --fixed-strings --ignore-case --quiet \
              'cross-origin-opener-policy: same-origin' <<< "${headers}"
            grep --fixed-strings --ignore-case --quiet \
              'cross-origin-resource-policy: same-origin' <<< "${headers}"
            grep --fixed-strings --ignore-case --quiet \
              'permissions-policy: camera=(), geolocation=(), microphone=(), payment=(), usb=()' \
              <<< "${headers}"
            grep --fixed-strings --ignore-case --quiet \
              'referrer-policy: no-referrer' <<< "${headers}"
            grep --fixed-strings --ignore-case --quiet \
              'x-content-type-options: nosniff' <<< "${headers}"
            grep --fixed-strings --ignore-case --quiet \
              'x-frame-options: DENY' <<< "${headers}"

            if grep --extended-regexp --ignore-case --quiet \
              '^server: nginx/[0-9]' <<< "${headers}"; then
              echo 'The Nginx version must not be disclosed.' >&2
              return 1
            fi
          }

          verify_headers "${frontend_headers}"
          verify_headers "${proxy_error_headers}"

      - name: Run passive OWASP ZAP baseline
        shell: bash
        run: |
          report_directory="${GITHUB_WORKSPACE}/artifacts/zap"
          install --directory --mode 0777 "${report_directory}"
          cp infrastructure/security/zap-baseline.conf \
            "${report_directory}/zap-baseline.conf"

          set +e
          docker run --rm \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --network "${COMPOSE_PROJECT_NAME}_app-network" \
            --volume "${report_directory}:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:2.17.0@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef \
            zap-baseline.py \
            -t http://frontend:8080 \
            -m 1 \
            -c zap-baseline.conf \
            -J zap-report.json \
            -r zap-report.html \
            -w zap-report.md
          zap_exit_code=$?
          set -e

          for report in zap-report.json zap-report.html zap-report.md; do
            if [[ ! -s "${report_directory}/${report}" ]]; then
              echo "ZAP report was not generated: ${report}" >&2
              exit 1
            fi
          done

          case "${zap_exit_code}" in
            0)
              echo "OWASP ZAP baseline completed without alerts." \
                >> "${GITHUB_STEP_SUMMARY}"
              ;;
            2)
              echo "OWASP ZAP baseline completed with reviewed warnings. See the attached report." \
                >> "${GITHUB_STEP_SUMMARY}"
              ;;
            1)
              echo "OWASP ZAP found an alert classified as FAIL." >&2
              exit 1
              ;;
            *)
              echo "OWASP ZAP failed to complete (exit code ${zap_exit_code})." >&2
              exit "${zap_exit_code}"
              ;;
          esac

      - name: Upload OWASP ZAP reports
        if: ${{ always() && hashFiles('artifacts/zap/zap-report.*') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/zap/zap-report.*
          if-no-files-found: error
          retention-days: 14

      - name: Show Compose diagnostics
        if: failure()
        working-directory: infrastructure/docker
        run: |
          docker compose ps --all
          docker compose logs --no-color --timestamps

      - name: Remove disposable stack
        if: always()
        working-directory: infrastructure/docker
        shell: bash
        run: |
          docker compose down --volumes --remove-orphans --timeout 10
          docker volume rm \
            "cav-smoke-data-protection-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            2>/dev/null || true

  validate-release-tag:
    name: Validate semantic release tag
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Validate release version
        id: version
        shell: bash
        run: |
          release_version="${GITHUB_REF_NAME#v}"

          if [[ ! "${release_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          echo "version=${release_version}" >> "${GITHUB_OUTPUT}"

  publish-platform:
    name: Publish verified ${{ matrix.image }} (${{ matrix.platform }})
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-and-scan
      - compose-smoke-test
      - validate-release-tag
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            dockerfile: infrastructure/docker/backend/Dockerfile
            platform: linux/amd64
            architecture: amd64
          - image: backend
            dockerfile: infrastructure/docker/backend/Dockerfile
            platform: linux/arm64
            architecture: arm64
          - image: frontend
            dockerfile: infrastructure/docker/frontend/Dockerfile
            platform: linux/amd64
            architecture: amd64
          - image: frontend
            dockerfile: infrastructure/docker/frontend/Dockerfile
            platform: linux/arm64
            architecture: arm64
    env:
      IMAGE_NAME: ghcr.io/ifpebj-ti/controle-acesso-veiculos-${{ matrix.image }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        if: matrix.architecture == 'arm64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image for publication
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          pull: true
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-${{ matrix.architecture }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.architecture }}

      - name: Reject all critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-${{ matrix.architecture }}
          format: table
          exit-code: "1"
          ignore-unfixed: false
          vuln-type: os,library
          severity: CRITICAL

      - name: Report all high vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-${{ matrix.architecture }}
          format: table
          exit-code: "0"
          ignore-unfixed: false
          vuln-type: os,library
          severity: HIGH

      - name: Reject fixable high vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-${{ matrix.architecture }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH

      - name: Generate image SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-${{ matrix.architecture }}
          format: spdx-json
          output: ${{ github.workspace }}/${{ matrix.image }}-${{ matrix.architecture }}.spdx.json
          exit-code: "0"
          vuln-type: os,library

      - name: Validate image SBOM
        shell: bash
        run: |
          sbom_path="${GITHUB_WORKSPACE}/${{ matrix.image }}-${{ matrix.architecture }}.spdx.json"

          if [[ ! -s "${sbom_path}" ]]; then
            echo "SBOM was not generated: ${sbom_path}" >&2
            exit 1
          fi

          sbom_size="$(stat --format='%s' "${sbom_path}")"
          if (( sbom_size > 16777216 )); then
            echo "SBOM exceeds the 16 MiB attestation limit: ${sbom_size} bytes" >&2
            exit 1
          fi

          jq --exit-status '
            .spdxVersion == "SPDX-2.3"
            and ((.packages | type) == "array")
            and ((.packages | length) > 0)
          ' "${sbom_path}" > /dev/null

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: true

      - name: Push verified platform image
        id: push
        shell: bash
        run: |
          platform_tag="${IMAGE_NAME}:sha-${GITHUB_SHA}-${{ matrix.architecture }}"
          docker push "${platform_tag}"

          digest="$(
            docker buildx imagetools inspect \
              "${platform_tag}" \
              --format '{{json .Manifest.Digest}}' \
              | tr -d '"'
          )"

          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Could not resolve a valid digest for ${platform_tag}" >&2
            exit 1
          fi

          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Upload platform SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.image }}-${{ matrix.architecture }}
          path: ${{ github.workspace }}/${{ matrix.image }}-${{ matrix.architecture }}.spdx.json
          if-no-files-found: error
          retention-days: 14

  publish-manifest:
    name: Publish verified ${{ matrix.image }} multi-platform manifest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - publish-platform
      - validate-release-tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - backend
          - frontend
    env:
      IMAGE_NAME: ghcr.io/ifpebj-ti/controle-acesso-veiculos-${{ matrix.image }}
      RELEASE_VERSION: ${{ needs.validate-release-tag.outputs.version }}

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: true

      - name: Download platform SBOMs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sbom-${{ matrix.image }}-*
          path: ${{ github.workspace }}/sboms
          merge-multiple: true

      - name: Create and validate multi-platform manifest
        id: manifest
        shell: bash
        run: |
          immutable_tag="${IMAGE_NAME}:sha-${GITHUB_SHA}"

          docker buildx imagetools create \
            --tag "${immutable_tag}" \
            "${IMAGE_NAME}:sha-${GITHUB_SHA}-amd64" \
            "${IMAGE_NAME}:sha-${GITHUB_SHA}-arm64"

          manifest_json="$(docker buildx imagetools inspect "${immutable_tag}" --raw)"

          jq --exit-status '
            (.schemaVersion == 2)
            and ([
              .manifests[]
              | select(.platform.os == "linux")
              | .platform.architecture
            ] | sort == ["amd64", "arm64"])
            and ([.manifests[] | select(.platform.os == "linux")] | length == 2)
          ' <<< "${manifest_json}" > /dev/null

          digest="$(
            docker buildx imagetools inspect \
              "${immutable_tag}" \
              --format '{{json .Manifest.Digest}}' \
              | tr -d '"'
          )"

          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Could not resolve a valid digest for ${immutable_tag}" >&2
            exit 1
          fi

          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Attest published manifest provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.manifest.outputs.digest }}

      - name: Attest amd64 SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          sbom-path: ${{ github.workspace }}/sboms/${{ matrix.image }}-amd64.spdx.json

      - name: Attest arm64 SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          sbom-path: ${{ github.workspace }}/sboms/${{ matrix.image }}-arm64.spdx.json

      - name: Publish immutable semantic release tag
        shell: bash
        run: |
          immutable_tag="${IMAGE_NAME}:sha-${GITHUB_SHA}"
          release_tag="${IMAGE_NAME}:${RELEASE_VERSION}"
          source_digest="${{ steps.manifest.outputs.digest }}"

          if [[ ! "${source_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Could not resolve a valid digest for ${immutable_tag}" >&2
            exit 1
          fi

          existing_digest="$(
            docker buildx imagetools inspect \
              "${release_tag}" \
              --format '{{json .Manifest.Digest}}' 2>/dev/null \
              | tr -d '"' \
              || true
          )"

          if [[ -n "${existing_digest}" && "${existing_digest}" != "${source_digest}" ]]; then
            echo "Refusing to move existing release tag ${release_tag}." >&2
            exit 1
          fi

          docker buildx imagetools create \
            --tag "${release_tag}" \
            "${IMAGE_NAME}@${source_digest}"

          release_digest="$(
            docker buildx imagetools inspect \
              "${release_tag}" \
              --format '{{json .Manifest.Digest}}' \
              | tr -d '"'
          )"

          if [[ "${release_digest}" != "${source_digest}" ]]; then
            echo "Release tag digest does not match ${immutable_tag}" >&2
            exit 1
          fi
