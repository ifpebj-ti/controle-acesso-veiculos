services:
  frontend:
    image: ghcr.io/ifpebj-ti/controle-acesso-veiculos-frontend:${DEPLOYMENT_VERSION:?Defina DEPLOYMENT_VERSION com uma versao publicada, por exemplo 0.4.0}
    pull_policy: always
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - edge

  backend:
    image: ghcr.io/ifpebj-ti/controle-acesso-veiculos-backend:${DEPLOYMENT_VERSION:?Defina DEPLOYMENT_VERSION com uma versao publicada, por exemplo 0.4.0}
    pull_policy: always
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      AllowedHosts: ${ALLOWED_HOSTS:?Defina ALLOWED_HOSTS com o host publico da aplicacao}
      ConnectionStrings__DefaultConnection: "Host=postgresql;Port=5432;Database=${POSTGRES_DB:?Defina POSTGRES_DB};Username=${POSTGRES_USER:?Defina POSTGRES_USER};Password=${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD};GSS Encryption Mode=Disable"
      Authentication__Jwt__SigningKey: ${JWT_SIGNING_KEY:?Defina JWT_SIGNING_KEY fora do repositorio}
      DataProtection__Enabled: "true"
      DataProtection__ApplicationName: controle-acesso-veiculos
      DataProtection__KeyRingPath: /var/lib/controle-acesso-veiculos/data-protection
      DataProtection__CertificatePath: /run/secrets/data-protection-certificate.pfx
      DataProtection__CertificatePasswordFile: /run/secrets/data-protection-certificate-password
      Observability__Enabled: ${OTEL_ENABLED:-false}
      Observability__ServiceName: ${OTEL_SERVICE_NAME:-controle-acesso-veiculos-api}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
    depends_on:
      postgresql:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /usr/bin/bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080;
          printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3;
          grep -q '200 OK' <&3
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    init: true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - data-protection-keys:/var/lib/controle-acesso-veiculos/data-protection
    secrets:
      - source: data-protection-certificate
        target: data-protection-certificate.pfx
      - source: data-protection-certificate-password
        target: data-protection-certificate-password
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - edge
      - data

  postgresql:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    pull_policy: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - data

networks:
  edge:
    driver: bridge
  data:
    driver: bridge
    internal: true

volumes:
  postgres-data:
  data-protection-keys:
    name: ${DATA_PROTECTION_KEY_RING_VOLUME:?Defina o volume compartilhado do key ring}
    external: true

secrets:
  data-protection-certificate:
    file: ${DATA_PROTECTION_CERTIFICATE_FILE:?Defina o caminho do certificado fora do repositorio}
  data-protection-certificate-password:
    file: ${DATA_PROTECTION_CERTIFICATE_PASSWORD_FILE:?Defina o secret com a senha do certificado}
