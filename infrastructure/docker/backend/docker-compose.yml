version: '3.8'

services:
  frontend:
    build:
      context: ../../
      dockerfile: infrastructure/docker/frontend/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    build:
      context: ../../
      dockerfile: infrastructure/docker/backend/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgresql;Database=controle_acesso;Username=postgres;Password=postgres
    depends_on:
      - postgresql
    networks:
      - app-network

  postgresql:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=controle_acesso
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data: